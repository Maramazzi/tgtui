[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tgtui"
version = "0.1.0"
description = "Minimalist Telegram TUI client"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.34.0",
    "textual>=0.59.0",
    "aiosqlite>=0.20.0",
    "toml>=0.10.2",
    "pyperclip>=1.8.2",
    "Pillow>=10.0.0",
    "wcwidth>=0.2.13",
]

[project.scripts]
tgtui = "main:run"
